<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%" role="img" aria-labelledby="title desc" style="display:block;background:#0f1724;">
    <title id="title">Tacoliyx V2</title>
    <desc id="desc">Welcome banner and status message</desc>
    <style>
        .bg{fill:#0f1724}
        .card{fill:#071029;rx:12}
        .heading{fill:#ffffff;font-family:Inter, Arial, sans-serif;font-size:16px;font-weight:700}
        .paragraph{fill:#cbd5e1;font-family:Inter, Arial, sans-serif;font-size:10px}
    </style>

    <rect class="bg" x="0" y="0" width="700" height="300"/>

    <g transform="translate(40,40)">
        <rect x="0" y="0" width="720" height="200" rx="12" fill="#071029"/>
        <text class="heading" x="24" y="52">Welcome to Tacoliyx V2 — This site is currently under active development.</text>
        <text class="paragraph" x="24" y="88">I'm working hard — school just started but I'm trying. This will be much better than Google Sites; please check back later for updates!</text>
    </g>
</svg>